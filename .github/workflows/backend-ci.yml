name: Backend CI

on:
  pull_request:
    paths:
      - "server/**"
      - "ci/verify-backend.mjs"
      - ".github/workflows/backend-ci.yml"
  push:
    paths:
      - "server/**"
      - "ci/verify-backend.mjs"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Run lint checks
        run: npm run lint --prefix server
      - name: Run contract tests
        run: npm test --prefix server
      - name: Validate schema and API startup
        env:
          DATABASE_URL: postgresql://eventhub:eventhub@127.0.0.1:5432/ci_validation?schema=public
        run: npm run verify --prefix server
