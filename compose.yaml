
services:
  mongodb:
    image: mongo:7
    container_name: eventhub-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-eventhub}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: event_management
    ports:
      - "${EVENTHUB_MONGODB_PORT:-27017}:27017"
    volumes:
      - eventhub_mongodb_data:/data/db
      - eventhub_mongodb_keyfile:/etc/mongo-keys
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        keyfile=/etc/mongo-keys/rs0.key

        if [ ! -s "$$keyfile" ]; then
          head -c 756 /dev/urandom | base64 > "$$keyfile"
        fi

        chown mongodb:mongodb "$$keyfile"
        chmod 400 "$$keyfile"

        exec docker-entrypoint.sh mongod \
          --replSet rs0 \
          --bind_ip_all \
          --keyFile "$$keyfile"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - "$$MONGO_INITDB_ROOT_USERNAME"
        - --password
        - "$$MONGO_INITDB_ROOT_PASSWORD"
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongodb-init:
    image: mongo:7
    container_name: eventhub-mongodb-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        uri="mongodb://$${MONGO_ROOT_USERNAME:-eventhub}:$${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin&directConnection=true"

        mongosh "$$uri" --quiet --eval '
          try {
            rs.status();
          } catch (error) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "localhost:27017" }]
            });
          }
        '

        mongosh "$$uri" --quiet --eval '
          const app = db.getSiblingDB("event_management");
          if (!app.getUser("eventhub")) {
            app.createUser({
              user: "eventhub",
              pwd: process.env.MONGO_APP_PASSWORD || process.env.MONGO_ROOT_PASSWORD,
              roles: [{ role: "readWrite", db: "event_management" }]
            });
          }
        '
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-eventhub}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}

volumes:
  eventhub_mongodb_data:
  eventhub_mongodb_keyfile:
