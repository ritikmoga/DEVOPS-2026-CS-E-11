<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventFlow | jQuery AJAX Demo</title>
  <link rel="stylesheet" href="/classic-events.css" />
</head>
<body>
  <main class="classic-shell">
    <a href="/">← Back to React app</a>
